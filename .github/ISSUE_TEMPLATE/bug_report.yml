name: Bug report
description: Something does not work as the README or the spec says
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please redact anything private before you paste it: file names, paths, URLs with tokens,
        account names. **Never attach a real, confidential or personal document** (bank, legal, medical, identity) to this issue;
        reproduce with a synthetic or public sample.

        A security problem is not a bug report: do not file it here. Read [SECURITY.md](https://github.com/AirplaneMode-Labs/runtime/blob/main/SECURITY.md)
        and report it privately.
  - type: checkboxes
    id: no-real-documents
    attributes:
      label: Confirmation
      options:
        - label: I have not attached any real, confidential or personal document (bank, legal, medical, identity). Any sample is synthetic or public.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version (for example 0.3.0-beta.2) or the commit you built.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence of commands or code that shows it. Redact first.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version if you ran a script, browser and version if you ran the demo.
