name: pages

# Builds the demo and deploys it to GitHub Pages at https://airplanemode-labs.github.io/runtime/.
# `DEMO_MODELS=1 npm run demo:build` generates the synthetic fixture, bundles the Apache-2.0 test model
# SmolLM2-135M-Instruct (fetched from a pinned revision into the cached .cache/models, every file
# re-hashed against test/tools/models.json: any mismatch fails the build), signs both manifests with a
# key pair that exists only inside this job (the public half is embedded in the pages), then runs the
# Vite build. Nothing built is committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-${{ hashFiles('test/tools/models.json') }}
      - name: Fetch the test model (https only, no token; re-hashes every cached file, refuses any mismatch)
        run: node test/tools/fetch-model.mjs smollm2-135m-instruct
      - name: Build the demo with the test model bundled
        run: DEMO_MODELS=1 npm run demo:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
