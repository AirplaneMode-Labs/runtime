name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (install scripts disabled by --ignore-scripts and by .npmrc)
        run: npm ci --ignore-scripts
      - name: Packages with install scripts (informational)
        run: npm run -s deps:scripts || true
      - name: Format, typecheck, unit tests, build
        run: npm run ci
      - name: Build the demo (same command as pages.yml)
        run: npm run demo:build
      - name: Pack, check the contents and install the tarball offline into a fresh directory
        run: npm run pack:check
      # No Chrome is installed here: the ubuntu-latest image already has Google Chrome, and the
      # Playwright config selects it with channel "chrome". A missing Chrome fails the job.
      - name: Check the preinstalled Google Chrome (Linux only)
        if: runner.os == 'Linux'
        run: google-chrome --version || { echo "Google Chrome is not installed on this runner" >&2; exit 1; }
      - name: Browser tests (Linux only)
        if: runner.os == 'Linux'
        run: npm run test:browser

  # Not part of the required "check (<os>)" jobs: it needs Hugging Face to be reachable, so an outage
  # there never turns the required checks red. First ran on GitHub on 9 Nov 2026 (green).
  model-wasm:
    name: model-wasm (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore the model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: models-${{ hashFiles('test/tools/models.json') }}
      - name: Fetch the test model (re-hashes every cached file)
        run: node test/tools/fetch-model.mjs smollm2-135m-instruct
      # Same as above: the preinstalled Google Chrome through Playwright channel "chrome".
      - name: Check the preinstalled Google Chrome
        run: google-chrome --version || { echo "Google Chrome is not installed on this runner" >&2; exit 1; }
      - name: WebAssembly leg behind the aborting network gate
        run: RUNTIME_MODEL=1 RUNTIME_MODEL_LEGS=wasm npm run test:model

  # Sprint 7 (B1, B2; TD-106, TD-118). The clean-install check and the test-key release rehearsal on the SAME artefacts:
  # npm ci --ignore-scripts, build, npm pack, install the tarball (not the source tree) into a fresh directory outside the
  # checkout with no sibling repository, make one asserted call, then manifest, SHA256SUMS, a TEST 1 signature, the
  # explicit-flag verification and the refusal proofs (scripts/release/rehearse.mjs). contents: read, no secret, no id-token,
  # no cache of any kind. It publishes nothing and the artefacts are short-lived (3 days) and named as rehearsals.
  # Proves: the Windows junction and symlink refusals, LF SHA256SUMS and the tarball install on three operating systems.
  release-rehearsal:
    name: release-rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: SOURCE_DATE_EPOCH from the commit (the rehearsal is reproducible)
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Install from the lockfile (install scripts off), so that the tests below use the locked vitest
        shell: bash
        run: npm ci --ignore-scripts
      - name: Rehearsal self-test (a missing, lying or signalled tool turns the proofs red)
        shell: bash
        run: node scripts/release/rehearse.mjs --self-test
      - name: Release tool vectors (the symlink and junction refusals must pass here, not skip)
        shell: bash
        run: npx vitest run test/release-tool.test.ts --reporter=verbose
      - name: Release rehearsal (clean install of the tarball, then the test-key rehearsal on the same artefacts)
        shell: bash
        run: node scripts/release/rehearse.mjs
      - name: Quick start (the README blocks, run against a tarball built from a copy of this checkout)
        shell: bash
        run: npx vitest run test/quickstart.test.ts
      - name: Upload the rehearsal artefacts (test key, NOT A RELEASE)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: REHEARSAL-test-key-NOT-A-RELEASE-runtime-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist-release/
            dist-release-report/
          include-hidden-files: false
          retention-days: 3
          if-no-files-found: error
